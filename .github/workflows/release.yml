name: 릴리스 (exe 배포)

# v로 시작하는 태그(예: v1.0.1)를 올리면 exe를 만들어 Releases에 올립니다.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "배포할 태그 (예: v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 필요한 프로그램 설치
        run: |
          python -m pip install --upgrade pip
          python -m pip install --only-binary=:all: -r requirements.txt

      - name: 기능 점검
        env:
          PYTHONIOENCODING: utf-8
        run: python tests/smoke_test.py

      - name: 버전 정보 만들기
        run: python tools/make_version_info.py

      - name: exe 만들기
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name smartpdfeditor --icon smartpdfeditor.ico --version-file version_info.txt
          --collect-all pymupdf smartpdfeditor.py

      - name: exe 점검
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\smartpdfeditor.exe -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "selftest 실패: 종료코드 $($p.ExitCode)" }

      - name: Releases에 올리기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: 스마트PDF Editor ${{ github.event.inputs.tag || github.ref_name }}
          body_path: docs/release-notes.md
          files: |
            dist/smartpdfeditor.exe
            LICENSE
