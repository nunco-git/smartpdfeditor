name: tmp-speed
on:
  push:
    branches: [test-speed]
jobs:
  t:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          python -m pip install --upgrade pip
          python -m pip install --only-binary=:all: -r requirements.txt pillow
      - name: bench
        env: { PYTHONIOENCODING: utf-8 }
        run: python -u bench/bench.py
      - name: smoke
        env: { PYTHONIOENCODING: utf-8 }
        run: |
          python -X faulthandler -u tests/smoke_test.py
          if ($LASTEXITCODE -ne 0) { exit 1 }
