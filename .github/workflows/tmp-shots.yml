name: tmp screenshots
on:
  push:
    branches: [main]
    paths: [".github/workflows/tmp-shots.yml"]
jobs:
  shots:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --only-binary=:all: -r requirements.txt pillow
      - env:
          PYTHONIOENCODING: utf-8
        run: python tests/smoke_test.py
      - if: always()
        run: |
          python -c "import glob,io,base64;from PIL import Image;[print('IMG', p.split('\\')[-1], base64.b64encode((lambda b:(Image.open(p).convert('RGB').save(b,'JPEG',quality=80),b.getvalue())[1])(io.BytesIO())).decode()) for p in sorted(glob.glob('screenshots/*.png'))]"
