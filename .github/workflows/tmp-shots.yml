name: tmp icon check
on:
  push:
    branches: [main]
    paths: [".github/workflows/tmp-shots.yml"]
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pillow
      - name: 공개된 v1.0.0 exe 받기
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download v1.0.0 -p smartpdfeditor.exe -D rel
      - name: exe 파일 아이콘·이름
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $ico = [System.Drawing.Icon]::ExtractAssociatedIcon("$PWD\rel\smartpdfeditor.exe")
          $bmp = New-Object System.Drawing.Bitmap 256, 256
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $big = New-Object System.Drawing.Icon("$PWD\smartpdfeditor.ico", 256, 256)
          $g.Clear([System.Drawing.Color]::White)
          $g.DrawIcon($ico, 10, 10)
          $bmp.Save("$PWD\exe_icon.png")
          $v = (Get-Item rel\smartpdfeditor.exe).VersionInfo
          "이름: $($v.FileDescription) / 버전: $($v.ProductVersion) / 만든 곳: $($v.CompanyName)"
          "IMG exe_icon.png " + [Convert]::ToBase64String([IO.File]::ReadAllBytes("$PWD\exe_icon.png"))
      - name: 실행해서 제목줄·작업표시줄 확인
        env:
          PYTHONIOENCODING: utf-8
        run: python tests/tmp_icon_check.py rel\smartpdfeditor.exe
