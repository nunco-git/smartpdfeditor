name: tmp icon check
on:
  push:
    branches: [main]
    paths: [".github/workflows/tmp-shots.yml"]
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pillow
      - name: 지금 코드로 exe 만들기
        run: |
          python -m pip install --only-binary=:all: -r requirements.txt
          python tools/make_version_info.py
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name smartpdfeditor --icon smartpdfeditor.ico --version-file version_info.txt --collect-all pymupdf --distpath rel smartpdfeditor.py
      - name: exe 파일 아이콘·이름
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $ico = [System.Drawing.Icon]::ExtractAssociatedIcon("$PWD\rel\smartpdfeditor.exe")
          $bmp = New-Object System.Drawing.Bitmap 256, 256
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $big = New-Object System.Drawing.Icon("$PWD\smartpdfeditor.ico", 256, 256)
          $g.Clear([System.Drawing.Color]::White)
          $g.DrawIcon($ico, 10, 10)
          $bmp.Save("$PWD\exe_icon.png")
          $v = (Get-Item rel\smartpdfeditor.exe).VersionInfo
          "이름: $($v.FileDescription) / 버전: $($v.ProductVersion) / 만든 곳: $($v.CompanyName)"
          "IMG exe_icon.png " + [Convert]::ToBase64String([IO.File]::ReadAllBytes("$PWD\exe_icon.png"))
      - name: 실행해서 제목줄·작업표시줄 확인
        env:
          PYTHONIOENCODING: utf-8
        run: python tests/tmp_icon_check.py rel\smartpdfeditor.exe
