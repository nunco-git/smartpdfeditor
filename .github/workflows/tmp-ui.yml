name: tmp-ui
on:
  push:
    branches: [test-ui]
jobs:
  t:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install --only-binary=:all: -r requirements.txt pillow
      - env: { PYTHONIOENCODING: utf-8 }
        run: python tmpt/shot.py
