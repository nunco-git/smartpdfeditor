name: 라이선스 파일 추가 (1회용)

# LICENSE 파일이 없을 때 gnu.org에서 AGPL-3.0 공식 원문을 받아 넣습니다.
on:
  push:
    branches: [main]
    paths: [".github/workflows/bootstrap-license.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  license:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: AGPL-3.0 원문 받기
        run: |
          if [ -f LICENSE ]; then echo "LICENSE 이미 있음"; exit 0; fi
          curl -fsSL https://www.gnu.org/licenses/agpl-3.0.txt -o LICENSE
          grep -q "GNU AFFERO GENERAL PUBLIC LICENSE" LICENSE
          grep -q "Version 3, 19 November 2007" LICENSE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LICENSE
          git commit -m "Add AGPL-3.0 LICENSE (gnu.org 공식 원문)"
          git push
